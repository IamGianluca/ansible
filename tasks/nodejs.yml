# Install Node.js on all systems: nvm-based LTS on Debian/Ubuntu and Arch,
# the Homebrew formula on macOS.
- name: Install Node.js via nvm
  block:
    - name: Download nvm installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh
        dest: "{{ ansible_facts['env']['HOME'] }}/.nvm-install.sh"
        mode: '0755'

    - name: Install nvm
      ansible.builtin.shell:
        cmd: "{{ ansible_facts['env']['HOME'] }}/.nvm-install.sh"
        creates: "{{ ansible_facts['env']['HOME'] }}/.nvm/nvm.sh"

    - name: Remove nvm installer
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.nvm-install.sh"
        state: absent

    # nvm refuses to install a node version while ~/.npmrc sets `prefix` or
    # `globalconfig`. We keep prefix=~/.local/npm so global tools (e.g. pi)
    # install there without sudo, so comment the line for the install step
    # and restore it right after.
    - name: Comment out npm prefix in .npmrc during nvm install
      ansible.builtin.shell:
        cmd: |
          if [ -f "{{ ansible_facts['env']['HOME'] }}/.npmrc" ]; then
            sed -i 's/^\(prefix\|globalconfig\)=/#\1=/' "{{ ansible_facts['env']['HOME'] }}/.npmrc"
          fi
      changed_when: false

    - name: Install Node.js LTS
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
          \. "$NVM_DIR/nvm.sh"
          nvm install --lts
        creates: "{{ ansible_facts['env']['HOME'] }}/.nvm/versions/node"

    - name: Restore npm prefix in .npmrc
      ansible.builtin.shell:
        cmd: |
          if [ -f "{{ ansible_facts['env']['HOME'] }}/.npmrc" ]; then
            sed -i 's/^#\(prefix\|globalconfig\)=/\1=/' "{{ ansible_facts['env']['HOME'] }}/.npmrc"
          fi
      changed_when: false
  when: ansible_facts['os_family'] in ["Debian", "Archlinux"]

- name: Install Node.js
  community.general.homebrew:
    name: node
    state: present
  when: ansible_facts['os_family'] == "Darwin"