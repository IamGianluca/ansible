- name: Install Neovim
  community.general.homebrew:
    name: neovim
    state: present

# Telescope also needs ripgrep and fd. Both are installed for every macOS host
# in tasks/macos_productivity_tools.yml, so they are not repeated here.

- name: Install tree-sitter-cli for nvim-treesitter (requires Cargo)
  community.general.cargo:
    name: tree-sitter-cli
    locked: true
    executable: "{{ ansible_env.HOME }}/.cargo/bin/cargo"
