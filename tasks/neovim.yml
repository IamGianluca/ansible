# The `ppa:` shorthand was an apt_repository feature: it expanded the URI and
# pulled the signing key from Launchpad. deb822_repository does neither, so
# both are spelled out here. Fingerprint comes from
# https://api.launchpad.net/devel/~neovim-ppa/+archive/ubuntu/unstable
- name: Add neovim unstable PPA signing key
  become: true
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x9DBB0BE9366964F134855E2255F96FCF8231B6DD"
    dest: /usr/share/keyrings/neovim-ppa-unstable.asc
    mode: '0644'

# Older tooling left the same Launchpad PPA behind under several file names
# and keyring locations: apt_repository wrote "ppa_neovim_ppa_*_<codename>.list"
# and imported the key into trusted.gpg.d (apt trusts it for every repository,
# not just this one), and earlier deb822 setups left a *.sources file with the
# key inlined in Signed-By. Two sources for one URI with different Signed-By
# values is a hard apt error, so sweep up anything naming the PPA before the
# new file goes in. The file deb822_repository manages is excluded so a rerun
# does not delete it.
- name: Find pre-deb822 neovim PPA apt sources
  become: true
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*neovim*'
  register: neovim_repo_legacy

- name: Find pre-deb822 neovim PPA signing keys
  become: true
  ansible.builtin.find:
    paths: /etc/apt/trusted.gpg.d
    patterns: '*neovim*'
  register: neovim_key_legacy

- name: Remove pre-deb822 neovim PPA apt sources
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ neovim_repo_legacy.files | map(attribute='path') | list
            + neovim_key_legacy.files | map(attribute='path') | list }}"
  when: item != '/etc/apt/sources.list.d/neovim-ppa-unstable.sources'

- name: Add neovim unstable repository
  become: true
  ansible.builtin.deb822_repository:
    name: neovim-ppa-unstable
    types: deb
    uris: https://ppa.launchpadcontent.net/neovim-ppa/unstable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /usr/share/keyrings/neovim-ppa-unstable.asc
    state: present

- name: Install Neovim
  become: true
  ansible.builtin.apt:
    name: ['neovim', 'python3-neovim', 'python3-pynvim', 'python3-venv']
    update_cache: yes

- name: Install extra Dependencies for Telescope
  become: true
  ansible.builtin.apt:
    name: ['ripgrep', 'fd-find']

- name: Find fdfind path
  ansible.builtin.command: which fdfind
  register: fdfind_path
  changed_when: false

- name: Create fd symlink (fd-find installs as fdfind on Debian/Ubuntu)
  ansible.builtin.file:
    src: "{{ fdfind_path.stdout }}"
    dest: ~/.local/bin/fd
    state: link

- name: Install tree-sitter-cli for nvim-treesitter (requires Cargo)
  community.general.cargo:
    name: tree-sitter-cli
    locked: true
    executable: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"

