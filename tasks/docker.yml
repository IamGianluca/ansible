- name: Install Docker prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# apt_repository wrote docker.list; deb822_repository writes docker.sources.
# Drop the old file so hosts provisioned before the switch do not end up with
# the repository configured twice.
- name: Remove pre-deb822 Docker apt source
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    # amd64 is Debian's name for x86_64; ansible_facts['architecture'] would write x86_64, which apt can't match
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    # deb822_repository does not refresh the cache, unlike apt_repository's
    # update_cache, so the repo added above is only visible to apt from here.
    update_cache: true

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
