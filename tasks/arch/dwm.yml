- name: Pull dwm-flexipatch repository
  ansible.builtin.include_tasks: jj_repo.yml
  vars:
    jj_repo_url: 'https://github.com/bakkeby/dwm-flexipatch.git'
    jj_repo_dest: "{{ ansible_user_dir }}/git/dwm-flexipatch"

- name: Install requirements for DWM
  become: true
  community.general.pacman:
    name: ['libx11', 'libxft', 'libxinerama']

# needed to control and mute volume via XF86 keys
- name: Install PulseAudio
  become: true
  community.general.pacman:
    name: ['pulseaudio']

# needed to control display brightness via XF86 keys
- name: Install brightnessctl
  become: true
  community.general.pacman:
    name: ['brightnessctl']

# Add the current user to the supplementary video group so the XF86 display
# brightness keys work without sudo. Only append: the user module's `group:`
# option sets the primary group, which is not what this task should touch.
- name: Add user to video group to enable changing display brightness without sudo
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: video
    append: true

- name: Pull dmenu-flexipatch repository
  ansible.builtin.include_tasks: jj_repo.yml
  vars:
    jj_repo_url: 'https://github.com/bakkeby/dmenu-flexipatch.git'
    jj_repo_dest: "{{ ansible_user_dir }}/git/dmenu-flexipatch"

- name: Build dmenu-flexipatch
  become: true
  command: make clean install
  args:
    chdir: "{{ ansible_user_dir }}/git/dmenu-flexipatch"

- name: Pull dwmblocks-async repository
  ansible.builtin.include_tasks: jj_repo.yml
  vars:
    jj_repo_url: 'https://github.com/UtkarshVerma/dwmblocks-async.git'
    jj_repo_dest: "{{ ansible_user_dir }}/git/dwmblocks-async"
  # The repo tracks its own config.h; `jj new` restores the upstream file each
  # run, and the dotfiles install re-creates our config.h symlink afterwards.

# We are building dwmblocks-async after having installed our
# dotfiles. See dwm_part2.yml playbook.
