- name: Add NVIDIA Container Toolkit GPG key
  become: true
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit.asc
    mode: '0644'

- name: Add NVIDIA Container Toolkit repository
  become: true
  # NVIDIA publishes a flat repo (no dists/); amd64 is Debian's name for x86_64
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /
    filename: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Install NVIDIA Container Toolkit
  become: true
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
  register: nvidia_ctk_install

- name: Configure NVIDIA container runtime
  become: true
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  changed_when: true

- name: Restart Docker
  become: true
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: nvidia_ctk_install is changed