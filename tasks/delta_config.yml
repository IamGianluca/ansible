# Wire delta (git-delta) into git and jj so diffs render with syntax
# highlighting and word-level emphasis everywhere.
#
# git: delta is git's pager; git feeds it uncolored unified diffs.
# jj: jj renders its own diffs, so delta hooks in as the diff formatter
#     (ui.diff-formatter), receiving the old/new file paths as $left/$right.
#     The bash wrapper only normalizes delta's exit code (delta mirrors git's
#     "differences found" exit status of 1, which jj would treat as failure).

- name: Configure git to use delta as pager
  community.general.git_config:
    name: core.pager
    value: delta
    scope: global
    state: present

- name: Configure git interactive diff filter for delta
  community.general.git_config:
    name: interactive.diffFilter
    value: delta --color-only
    scope: global
    state: present

- name: Enable delta navigation in git diffs
  community.general.git_config:
    name: delta.navigate
    value: "true"
    scope: global
    state: present

- name: Use zdiff3 conflict style for clearer merge conflict display
  community.general.git_config:
    name: merge.conflictStyle
    value: zdiff3
    scope: global
    state: present

- name: Check if jj (Jujutsu) is installed
  ansible.builtin.command: which jj
  register: jj_which
  changed_when: false
  failed_when: false

- name: Configure jj to render diffs with delta
  ansible.builtin.command: >-
    jj config set --user ui.diff-formatter
    '["bash","-c","delta --paging=never \"$1\" \"$2\"; exit 0","delta","$left","$right"]'
  changed_when: false
  when: jj_which.rc == 0