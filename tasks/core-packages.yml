- name: Install development & build tools
  become: true
  ansible.builtin.apt:
    name:
      - build-essential  
      - cmake            
      - git              
    state: present

- name: Install system utilities
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common  
      - unzip                       
      - curl                        
      - wget                        
      - tar                         
      - gzip                        
      - htop                        
      - tree                        
    state: present

- name: Install networking tools
  become: true
  ansible.builtin.apt:
    name:
      - mosh
    state: present

- name: Install Python development environment
  become: true
  ansible.builtin.apt:
    name:
      - python3                     
      - python3-dev                 
      - python3-pip                 
    state: present

- name: Install productivity & workflow tools
  become: true
  ansible.builtin.apt:
    name:
      - fzf                         
      - direnv                      
    state: present

- name: Install search & navigation tools
  become: true
  ansible.builtin.apt:
    name:
      - bat
      - fd-find
      - ripgrep
      - git-delta
    state: present

- name: Ensure user local bin directory exists
  ansible.builtin.file:
    path: ~/.local/bin
    state: directory

- name: Find bat binary path
  ansible.builtin.command: which batcat
  register: batcat_path
  changed_when: false

- name: Create bat symlink (bat package installs as batcat on Debian/Ubuntu)
  ansible.builtin.file:
    src: "{{ batcat_path.stdout }}"
    dest: ~/.local/bin/bat
    state: link

- name: Find fd binary path
  ansible.builtin.command: which fdfind
  register: fdfind_path
  changed_when: false

- name: Create fd symlink (fd-find package installs as fdfind on Debian/Ubuntu)
  ansible.builtin.file:
    src: "{{ fdfind_path.stdout }}"
    dest: ~/.local/bin/fd
    state: link

- name: Install performance & profiling tools
  become: true
  ansible.builtin.apt:
    name:
      - linux-tools-common          
      - linux-tools-generic         
    state: present
