- name: Check for SSH key
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
  register: ssh_key

- name: Clone .dotfiles
  ansible.builtin.include_tasks: jj_repo.yml
  vars:
    jj_repo_url: 'git@github.com:IamGianluca/dotfiles.git'
    jj_repo_dest: "{{ lookup('env', 'HOME') }}/.dotfiles"
    # Never auto-update: the dotfiles repo is a jj repo we work in directly
    # (commits and WIP). jj's update would reset the tree to the branch tip,
    # leaving WIP only in snapshot commits. Updates happen manually with jj.
    jj_repo_update: false
  when: ssh_key.stat.exists

- name: Install dotfiles
  ansible.builtin.shell: cd $HOME/.dotfiles && ./install
  register: dotfiles_result
  changed_when: "'All commands have been executed' in dotfiles_result.stdout"
  # We need to ignore errors because the script returns exit code 1
  # even when it completes most tasks successfully with only some links missing
  failed_when: false
  when: ssh_key.stat.exists

- name: Display dotfiles installation results
  ansible.builtin.debug:
    msg: "{{ dotfiles_result.stdout_lines }}"
  when: dotfiles_result.stdout is defined
