# this playbook is dedicated to ubuntu docker containers
- hosts: localhost
  pre_tasks:
    - name: Update Apt
      become: true
      apt: update_cache=yes
      changed_when: False
  tasks:
    - import_tasks: tasks/core-packages.yml
    - import_tasks: tasks/jujutsu.yml
    - import_tasks: tasks/nvidia.yml
    - import_tasks: tasks/zsh.yml
    - import_tasks: tasks/dotfiles_https.yml
    - import_tasks: tasks/tmux.yml
    - import_tasks: tasks/nodejs.yml
    - import_tasks: tasks/rust.yml
    - import_tasks: tasks/neovim.yml
    - import_tasks: tasks/hunk.yml
